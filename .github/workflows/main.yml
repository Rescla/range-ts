# CI for range-ts: install, build, test across node/jsdom/chrome.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Explicit least privilege. Without a `permissions:` key this job inherits
    # the repository/org default, and the GitHub default for new repos has been
    # "Read and write" — so a job that only needs to read the tree has been
    # handed a writable GITHUB_TOKEN for every push and PR. A writable token in
    # a job that runs unmerged PR code is the shape a supply-chain attack rides
    # on (the workflow could be edited, a tag moved, a release note rewritten).
    # This job writes nothing, so it gets nothing.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # Pin the toolchain. Without this the job uses whatever Node/npm the runner
      # image happens to ship, and npm versions resolve optional peer deps
      # differently: npm 10 wanted a nested webpack@5.112.2 to satisfy
      # schema-utils' peerOptional, npm 11 did not, so a lockfile written by one
      # was "out of sync" for the other. Pinning Node (and a lockfile that now
      # installs cleanly under both npm 10 and 11) makes this deterministic.
      #
      # Node 26 is the current LTS and matches the version this package is
      # developed on locally.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # NOTE: do NOT add --omit=optional here.
      #
      # TypeScript 7 is the Go rewrite: the compiler itself is not JS, it ships
      # as a platform-specific optionalDependency (@typescript/typescript-linux-x64
      # and friends). Omitting optionals deletes the compiler and the build dies
      # with:
      #   Error: Unable to resolve @typescript/typescript-linux-x64.
      #     Either your platform is unsupported, or you are missing the package on disk.
      #
      # This is not in tension with the repo's ignore-scripts=true: those native
      # packages are prebuilt binaries that need no install script. Hardening the
      # install and skipping the compiler are different switches.
      - name: Npm ci
        run: npm ci

      - name: Run build
        run: npm run build

      # The Code Climate coverage steps that used to sit here are gone, and not
      # because the secret was missing. The Code Climate test reporter is
      # discontinued: codeclimate/test-reporter now redirects to
      # qltysh-archive/test-reporter (archived, last pushed 2024-07-08), and
      # every download URL 404s:
      #   .../test-reporter-latest-linux-amd64  -> 404
      #   .../test-reporter-latest-linux-386    -> 404
      #   .../test-reporter-latest-darwin-amd64 -> 404
      #
      # The old step also had a failure mode worth naming, because it is a common
      # one: `curl -L <url> > ./cc-test-reporter` without `-f` writes the
      # response body whatever it is, so the 404 HTML page landed in a file that
      # was then chmod +x and executed as a shell script. The step failed with a
      # bash syntax error on `<!DOCTYPE html>` several commands away from the
      # actual problem. If a workflow ever downloads a binary again, use
      # `curl -f` so an HTTP error fails at the download instead of turning into
      # a corrupt executable.
      #
      # Coverage is still produced locally by karma-coverage-istanbul and Stryker;
      # it just is not uploaded to a third-party dashboard any more.
