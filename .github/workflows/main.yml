# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Pin the toolchain. Without this the job uses whatever Node/npm the runner
      # image happens to ship, and npm versions resolve optional peer deps
      # differently: npm 10 wanted a nested webpack@5.112.2 to satisfy
      # schema-utils' peerOptional, npm 11 did not, so a lockfile written by one
      # was "out of sync" for the other. Pinning Node (and a lockfile that now
      # installs cleanly under both npm 10 and 11) makes this deterministic.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Npm ci
        run: npm ci --omit=optional

      - name: Codeclimate before build
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        run: |
          curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
          chmod +x ./cc-test-reporter
          ./cc-test-reporter before-build

      # Runs a single command using the runners shell
      - name: Run build
        run: npm run build

      - name: Codeclimate after build
        env: # Or as an environment variable
          CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
        run: |
          ./cc-test-reporter format-coverage .tmp/coverage/lcov.info -o .tmp/coverage/codeclimate.json -t lcov
          ./cc-test-reporter upload-coverage -i .tmp/coverage/codeclimate.json
