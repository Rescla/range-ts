name: Release

# CI stages the package. Promotion is a human step, done out of band or on the
# npmjs.com Staged Packages tab — deliberately NOT in this workflow.
#
# Why not `npm publish`: npm is restricting tokens that bypass 2FA for direct
# publishing (registry notice: "npm tokens that bypass 2FA are being restricted
# for account changes and direct publishing", gh.io/npm-gat-bypass2fa-deprecation).
# A CI job cannot answer a 2FA challenge, so direct publish from CI is being
# closed off. Staged publishing is the sanctioned shape:
#
#   npm stage publish   -> no 2FA. CI does this.
#   npm stage approve   -> 2FA. A human does this.
#
# That split is the security property, not friction to route around.
#
# Requires npm CLI >= 11.15.0 and Node >= 22.14.0. Node 26 (current LTS)
# bundles npm 11.20.0, which clears both.
#
# Full process, including the human-side commands: RELEASE.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the actual stage submission"
        type: boolean
        default: false

jobs:
  stage:
    # Pinned to match main.yml — `ubuntu-latest` is mid-migration from 24.04
    # to 26.04 (GitHub changelog 2026-09-17). A job that mints a package
    # attestation should not be running on an image that can change under it
    # without a commit. See main.yml for the full rationale.
    runs-on: ubuntu-24.04
    permissions:
      # Least privilege: this job publishes nothing and pushes no refs. It only
      # reads the repo and mints an attestation. Promotion, tagging and the
      # GitHub release are all human-side now, so no contents:write here.
      contents: read
      id-token: write # npm provenance attestation (OIDC)

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Show toolchain
        run: |
          node -v
          npm -v
          echo "ignore-scripts = $(npm config get ignore-scripts)"
          echo "min-release-age = $(npm config get min-release-age)"
          # Fail early and loudly if this npm cannot stage at all, rather than
          # discovering it four steps into a release.
          npm stage --help >/dev/null 2>&1 \
            || { echo "::error::this npm has no 'stage' command (needs >= 11.15.0)"; exit 1; }

      - name: Npm ci
        run: npm ci

      # The build runs the full test suite (build:clean -> compile -> test), so a
      # red suite stops the release here instead of after the stage.
      - name: Build and test
        run: npm run build

      - name: Stage the package
        if: ${{ !inputs.dry_run }}
        env:
          # The secret is NPM_AUTH_TOKEN; the environment variable npm actually
          # reads is NODE_AUTH_TOKEN. They are different names and both are needed.
          #
          # setup-node's registry-url writes ~/.npmrc containing
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # which is a REFERENCE resolved when npm runs, not a value baked in at
          # setup time. So the env must be present on this step. Without it the
          # reference expands empty and npm reports:
          #   "Unable to authenticate, your authentication token seems to be invalid."
          # That is what broke the previous two attempts: the env was dropped in
          # the rewrite from `npm publish` to `npm stage publish`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          # NOTE: no package-spec argument. `npm stage publish range-ts` resolves
          # the name against the REGISTRY, not the working directory, and fails
          # with "You cannot publish over the previously published versions".
          # Staging the current directory means passing nothing (or `.`).
          npm stage publish --access public --provenance

      - name: Report the stage id and the approve command
        if: ${{ !inputs.dry_run }}
        env:
          # `npm stage list` hits GET /-/stage and 401s without a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm stage list "range-ts@$VERSION" --json > /tmp/staged.json || true
          STAGE_ID=$(node -e '
            const fs = require("fs");
            let raw;
            try { raw = JSON.parse(fs.readFileSync("/tmp/staged.json", "utf8")); }
            catch (e) { console.log(""); process.exit(0); }
            const rows = Array.isArray(raw) ? raw : (raw.staged || raw.data || []);
            // Match on name AND version only. There is deliberately no `|| rows[0]`
            // fallback: if the filter misses, printing some other staged package's
            // id would hand the reader an instruction that approves the wrong
            // artifact. Missing is reported as missing below, with the raw output.
            const hit = rows.find(r => (r.package || r.name) === "range-ts" && r.version === process.argv[1]);
            if (!hit) { console.log(""); process.exit(0); }
            console.log(hit.stageId || hit.stage_id || hit.id || "");
          ' "$VERSION" || true)

          echo "staged package: range-ts@$VERSION"
          if [ -n "$STAGE_ID" ]; then
            echo "stage id: $STAGE_ID"
            echo "::notice::Staged as $STAGE_ID — approve it to publish"
            {
              echo "### Staged: range-ts@$VERSION"
              echo ""
              echo "| | |"
              echo "|:--|:--|"
              echo "| **stage id** | \`$STAGE_ID\` |"
              echo ""
              echo "**Next step is human — approval requires a 2FA challenge, so it cannot run in CI.**"
              echo ""
              echo "\`\`\`bash"
              echo "npm stage view $STAGE_ID      # review metadata"
              echo "npm stage download $STAGE_ID  # optional: pull the tarball and inspect it"
              echo "npm stage approve $STAGE_ID   # publishes live, prompts for 2FA"
              echo "\`\`\`"
              echo ""
              echo "Or use the **Staged Packages** tab on npmjs.com."
              echo ""
              echo "To back out: \`npm stage reject $STAGE_ID\` — nothing was published,"
              echo "so nothing needs unpublishing."
              echo ""
              echo "Tagging and the GitHub release are also manual from here; see RELEASE.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Do not guess an id. Say the shape could not be read and point at the
            # raw output rather than printing a plausible-looking nothing.
            echo "::warning::Could not read the stage id from 'npm stage list' output."
            echo "Raw output follows; find the id on the Staged Packages tab at npmjs.com."
            cat /tmp/staged.json
          fi

      - name: Dry-run report
        if: ${{ inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm stage publish --access public --dry-run
          echo "dry run: nothing staged for range-ts@$VERSION"
